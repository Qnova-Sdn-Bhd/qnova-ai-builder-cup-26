[project]
name = "handoff-guardian-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "firebase-admin>=6.7,<8",
  "google-cloud-firestore>=2.20,<3",
  "google-cloud-storage>=3,<4",
  "google-cloud-documentai>=3,<4",
  "google-cloud-tasks>=2.19,<3",
  "google-cloud-aiplatform[agent_engines]==2.5.0",
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0.2,<7",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handoff_guardian"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".tools", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["handoff_guardian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
